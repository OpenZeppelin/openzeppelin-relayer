---
# pnpm >= 11 requires dependency build scripts to be approved explicitly; pnpm >= 12
# fails the install otherwise. esbuild's postinstall selects the platform binary.
allowBuilds:
  esbuild: true
overrides:
  axios: '>=1.18.0'
  esbuild: '>=0.28.2'
  follow-redirects: '>=1.16.0'
  js-yaml: ^3.14.2
  minimatch: ^3.1.3
  picomatch: ^2.3.2
  tmp: '>=0.2.6'
  uuid: ^11.1.1
  ws: '>=8.20.1'
